<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Power BI Dynamic Discovery POC</title>

    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
</head>

<body>

    <h2>Power BI Dynamic Discovery POC</h2>

    <button id="loginButton">Sign in with Microsoft</button>

    <button id="testPowerBIButton" style="display:none;">
        Test Power BI Access
    </button>

    <p id="status">
        Not signed in.
    </p>

    <pre id="result"></pre>

    <script>

        const CLIENT_ID = "6588aca8-e4a4-4d89-b1b0-3ddac9ac3db9";

        const msalConfig = {
            auth: {
                clientId: CLIENT_ID,
                authority: "https://login.microsoftonline.com/organizations",
                redirectUri:
                    "https://gopitableau.github.io/Power-BI-Dynamic-Writeback-POC/"
            },
            cache: {
                cacheLocation: "localStorage"
            }
        };

        const msalInstance =
            new msal.PublicClientApplication(msalConfig);

        const powerBIScope =
            "https://analysis.windows.net/powerbi/api/Report.Read.All";


        async function initialize() {

            try {

                await msalInstance.initialize();

                const response =
                    await msalInstance.handleRedirectPromise();

                if (response) {

                    showSignedInUser(response.account);

                    return;
                }

                const accounts =
                    msalInstance.getAllAccounts();

                if (accounts.length > 0) {

                    showSignedInUser(accounts[0]);
                }

            }
            catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Authentication error: " + error.message;
            }
        }


        document.getElementById("loginButton")
            .addEventListener("click", async function () {

                try {

                    await msalInstance.loginRedirect({

                        scopes: [
                            "User.Read",
                            powerBIScope
                        ]

                    });

                }
                catch (error) {

                    console.error(error);

                    document.getElementById("status").textContent =
                        "Login error: " + error.message;
                }

            });


        async function showSignedInUser(account) {

            document.getElementById("status").textContent =
                "Signed in successfully as: " +
                (account.username || account.name);

            document.getElementById("loginButton").style.display =
                "none";

            document.getElementById("testPowerBIButton").style.display =
                "inline-block";
        }


        document.getElementById("testPowerBIButton")
            .addEventListener("click", async function () {

                const resultElement =
                    document.getElementById("result");

                resultElement.textContent =
                    "Getting Power BI access token...";

                try {

                    const accounts =
                        msalInstance.getAllAccounts();

                    if (accounts.length === 0) {

                        throw new Error(
                            "No signed-in account found."
                        );
                    }

                    const tokenResponse =
                        await msalInstance.acquireTokenSilent({

                            scopes: [powerBIScope],

                            account: accounts[0]

                        });

                    resultElement.textContent =
                        "Token received. Calling Power BI...";

                    const response =
                        await fetch(
                            "https://api.powerbi.com/v1.0/myorg/groups/a7d9dbb8-000f-4978-8081-e658a24539b4/reports/3e159d02-3091-4567-884f-e47e2b868657/pages",
                            {
                                method: "GET",

                                headers: {
                                    "Authorization":
                                        "Bearer " +
                                        tokenResponse.accessToken
                                }
                            }
                        );

                    const data =
                        await response.json();

                    if (!response.ok) {

                        throw new Error(
                            "Power BI API error: " +
                            response.status +
                            " " +
                            JSON.stringify(data)
                        );
                    }

                    resultElement.textContent =
                        JSON.stringify(data, null, 2);

                }
                catch (error) {

                    console.error(error);

                    resultElement.textContent =
                        "Power BI test failed:\n\n" +
                        error.message;
                }

            });


        initialize();

    </script>

</body>
</html>
