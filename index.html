<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Power BI Dynamic Discovery POC</title>

    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            padding: 8px 14px;
            margin-right: 10px;
            cursor: pointer;
        }

        select {
            padding: 7px;
            margin-left: 8px;
        }

        #tableContainer {
            margin-top: 25px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
        }

        th,
        td {
            border: 1px solid #cccccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }

        #actionContainer {
            margin-top: 15px;
        }

        #payloadContainer {
            margin-top: 20px;
        }

        #payload {
            background: #f5f5f5;
            padding: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #embedContainer {
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Power BI Dynamic Discovery POC</h2>

    <button id="loginButton">
        Sign in with Microsoft
    </button>

    <button id="discoverButton" style="display:none;">
        Discover Visuals
    </button>

    <p id="status">
        Not signed in.
    </p>

    <div id="visualSelectorContainer" style="display:none;">

        <label>
            Select Visual:
        </label>

        <select id="visualSelector"></select>

    </div>

    <div id="tableContainer"></div>

    <div id="actionContainer" style="display:none;">

        <button id="addRowButton">
            + Add Row
        </button>

        <button id="submitButton">
            Submit All
        </button>

        <button id="sendEmailButton">
            Send Email
        </button>

    </div>

    <div id="payloadContainer" style="display:none;">

        <h3>Submit Payload</h3>

        <pre id="payload"></pre>

    </div>

    <div id="embedContainer"></div>


    <script>

        // ============================================================
        // CONFIGURATION
        // ============================================================

        const CLIENT_ID =
            "6588aca8-e4a4-4d89-b1b0-3ddac9ac3db9";

        const REPORT_ID =
            "3e159d02-3091-4567-884f-e47e2b868657";

        const EMBED_URL =
            "https://app.powerbi.com/reportEmbed?reportId=3e159d02-3091-4567-884f-e47e2b868657&groupId=a7d9dbb8-000f-4978-8081-e658a24539b4";

        const APPS_SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyXRtspwKfCFKJcrNHz3QxQOvMGnhyW95n4Gr4-xHEtxmsxbOjWOUQMSaXemdW9RgNJ/exec";


        // ============================================================
        // AUTHENTICATION
        // ============================================================

        const msalConfig = {

            auth: {

                clientId: CLIENT_ID,

                authority:
                    "https://login.microsoftonline.com/organizations",

                redirectUri:
                    "https://gopitableau.github.io/Power-BI-Dynamic-Writeback-POC/"
            },

            cache: {

                cacheLocation: "localStorage"
            }
        };


        const msalInstance =
            new msal.PublicClientApplication(msalConfig);


        const POWERBI_SCOPE =
            "https://analysis.windows.net/powerbi/api/Report.Read.All";

        const GRAPH_SCOPES = [
            "User.Read",
            "Mail.Send"
        ];


        let embeddedReport = null;

        let discoveredVisuals = [];

        let newRows = [];


        // ============================================================
        // INITIALIZE
        // ============================================================

        async function initialize() {

            try {

                await msalInstance.initialize();

                const response =
                    await msalInstance.handleRedirectPromise();


                if (response) {

                    showSignedInUser(
                        response.account
                    );

                    return;
                }


                const accounts =
                    msalInstance.getAllAccounts();


                if (accounts.length > 0) {

                    showSignedInUser(
                        accounts[0]
                    );
                }

            }

            catch (error) {

                console.error(error);

                document.getElementById(
                    "status"
                ).textContent =
                    "Authentication error: " +
                    error.message;
            }
        }


        // ============================================================
        // LOGIN
        // ============================================================

        document.getElementById(
            "loginButton"
        ).addEventListener(
            "click",
            async function () {

                try {

                    await msalInstance.loginRedirect({

                        scopes: GRAPH_SCOPES

                    });

                }

                catch (error) {

                    console.error(error);

                    document.getElementById(
                        "status"
                    ).textContent =
                        "Login error: " +
                        error.message;
                }

            }
        );


        // ============================================================
        // SHOW USER
        // ============================================================

        function showSignedInUser(account) {

            document.getElementById(
                "status"
            ).textContent =
                "Signed in successfully as: " +
                (account.username || account.name);


            document.getElementById(
                "loginButton"
            ).style.display =
                "none";


            document.getElementById(
                "discoverButton"
            ).style.display =
                "inline-block";
        }


        // ============================================================
        // GET POWER BI ACCESS TOKEN
        // ============================================================

        async function getPowerBIAccessToken() {

            const accounts =
                msalInstance.getAllAccounts();


            if (accounts.length === 0) {

                throw new Error(
                    "No signed-in account found."
                );
            }


            const tokenResponse =
                await msalInstance.acquireTokenSilent({

                    scopes: [POWERBI_SCOPE],

                    account: accounts[0]

                });


            return tokenResponse.accessToken;
        }


        // ============================================================
        // DISCOVER VISUALS
        // ============================================================

        document.getElementById(
            "discoverButton"
        ).addEventListener(
            "click",
            async function () {

                try {

                    const accessToken =
                        await getPowerBIAccessToken();


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Loading Power BI report...";


                    const models =
                        window[
                            "powerbi-client"
                        ].models;


                    const embedConfiguration = {

                        type: "report",

                        tokenType:
                            models.TokenType.Aad,

                        accessToken:
                            accessToken,

                        embedUrl:
                            EMBED_URL,

                        id:
                            REPORT_ID,

                        permissions:
                            models.Permissions.Read,

                        settings: {

                            panes: {

                                filters: {
                                    visible: false
                                },

                                pageNavigation: {
                                    visible: false
                                }

                            }

                        }

                    };


                    const container =
                        document.getElementById(
                            "embedContainer"
                        );


                    embeddedReport =
                        powerbi.embed(
                            container,
                            embedConfiguration
                        );


                    embeddedReport.on(
                        "loaded",
                        async function () {

                            try {

                                const pages =
                                    await embeddedReport.getPages();


                                discoveredVisuals = [];


                                for (
                                    const page of pages
                                ) {

                                    const visuals =
                                        await page.getVisuals();


                                    for (
                                        const visual of visuals
                                    ) {

                                        try {

                                            const exportResult =
                                                await visual.exportData(
                                                    models.ExportDataType.Summarized,
                                                    100
                                                );


                                            discoveredVisuals.push({

                                                pageName:
                                                    page.name,

                                                pageDisplayName:
                                                    page.displayName,

                                                visualName:
                                                    visual.name,

                                                visualType:
                                                    visual.type,

                                                visualTitle:
                                                    visual.title,

                                                data:
                                                    exportResult.data

                                            });

                                        }

                                        catch (error) {

                                            console.log(
                                                "Skipping visual:",
                                                visual.name
                                            );
                                        }
                                    }
                                }


                                populateVisualSelector();


                                document.getElementById(
                                    "visualSelectorContainer"
                                ).style.display =
                                    "block";


                                document.getElementById(
                                    "actionContainer"
                                ).style.display =
                                    "block";


                                document.getElementById(
                                    "status"
                                ).textContent =
                                    "Visuals discovered successfully.";

                            }

                            catch (error) {

                                console.error(error);

                                document.getElementById(
                                    "status"
                                ).textContent =
                                    "Discovery failed: " +
                                    error.message;
                            }

                        }
                    );


                    embeddedReport.on(
                        "error",
                        function (event) {

                            console.error(event);

                            document.getElementById(
                                "status"
                            ).textContent =
                                "Power BI report error.";
                        }
                    );

                }

                catch (error) {

                    console.error(error);

                    document.getElementById(
                        "status"
                    ).textContent =
                        "Discovery failed: " +
                        error.message;
                }

            }
        );


        // ============================================================
        // VISUAL DROPDOWN
        // ============================================================

        function populateVisualSelector() {

            const selector =
                document.getElementById(
                    "visualSelector"
                );


            selector.innerHTML = "";


            discoveredVisuals.forEach(
                function (visual, index) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        index;


                    option.textContent =
                        visual.visualTitle ||
                        visual.visualType ||
                        visual.visualName;


                    selector.appendChild(
                        option
                    );
                }
            );


            if (
                discoveredVisuals.length > 0
            ) {

                newRows = [];

                renderSelectedVisual(0);
            }
        }


        // ============================================================
        // VISUAL SELECTION
        // ============================================================

        document.getElementById(
            "visualSelector"
        ).addEventListener(
            "change",
            function () {

                const index =
                    Number(
                        this.value
                    );


                newRows = [];


                document.getElementById(
                    "payloadContainer"
                ).style.display =
                    "none";


                renderSelectedVisual(
                    index
                );
            }
        );


        // ============================================================
        // RENDER SELECTED VISUAL
        // ============================================================

        function renderSelectedVisual(index) {

            const visual =
                discoveredVisuals[index];


            if (!visual) {

                return;
            }


            const rows =
                parseCSV(
                    visual.data
                );


            if (
                rows.length === 0
            ) {

                return;
            }


            const headers =
                rows[0];


            const dataRows =
                rows.slice(1);


            const table =
                document.createElement(
                    "table"
                );


            const thead =
                document.createElement(
                    "thead"
                );


            const headerRow =
                document.createElement(
                    "tr"
                );


            headers.forEach(
                function (header) {

                    const th =
                        document.createElement(
                            "th"
                        );


                    th.textContent =
                        header;


                    headerRow.appendChild(
                        th
                    );
                }
            );


            const inputHeader =
                document.createElement(
                    "th"
                );


            inputHeader.textContent =
                "User Input";


            headerRow.appendChild(
                inputHeader
            );


            thead.appendChild(
                headerRow
            );


            table.appendChild(
                thead
            );


            const tbody =
                document.createElement(
                    "tbody"
                );


            // --------------------------------------------------------
            // EXISTING POWER BI ROWS
            // --------------------------------------------------------

            dataRows.forEach(
                function (row) {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    tr.dataset.recordType =
                        "existing";


                    row.forEach(
                        function (value) {

                            const td =
                                document.createElement(
                                    "td"
                                );


                            td.textContent =
                                value;


                            tr.appendChild(
                                td
                            );
                        }
                    );


                    const inputCell =
                        document.createElement(
                            "td"
                        );


                    const input =
                        document.createElement(
                            "input"
                        );


                    input.type =
                        "text";


                    input.dataset.edited =
                        "false";


                    input.addEventListener(
                        "input",
                        function () {

                            input.dataset.edited =
                                "true";
                        }
                    );


                    inputCell.appendChild(
                        input
                    );


                    tr.appendChild(
                        inputCell
                    );


                    tbody.appendChild(
                        tr
                    );
                }
            );


            // --------------------------------------------------------
            // NEW ROWS
            // --------------------------------------------------------

            newRows.forEach(
                function (newRow, newRowIndex) {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    tr.dataset.recordType =
                        "new";


                    newRow.forEach(
                        function (value, columnIndex) {

                            const td =
                                document.createElement(
                                    "td"
                                );


                            const input =
                                document.createElement(
                                    "input"
                                );


                            input.type =
                                "text";


                            input.value =
                                value || "";


                            input.addEventListener(
                                "input",
                                function () {

                                    newRows[
                                        newRowIndex
                                    ][
                                        columnIndex
                                    ] =
                                        this.value;
                                }
                            );


                            td.appendChild(
                                input
                            );


                            tr.appendChild(
                                td
                            );
                        }
                    );


                    tbody.appendChild(
                        tr
                    );
                }
            );


            table.appendChild(
                tbody
            );


            const container =
                document.getElementById(
                    "tableContainer"
                );


            container.innerHTML =
                "";


            container.appendChild(
                table
            );
        }


        // ============================================================
        // ADD ROW
        // ============================================================

        document.getElementById(
            "addRowButton"
        ).addEventListener(
            "click",
            function () {

                const selectedIndex =
                    Number(
                        document.getElementById(
                            "visualSelector"
                        ).value
                    );


                const visual =
                    discoveredVisuals[
                        selectedIndex
                    ];


                if (!visual) {

                    return;
                }


                const rows =
                    parseCSV(
                        visual.data
                    );


                if (
                    rows.length === 0
                ) {

                    return;
                }


                const columnCount =
                    rows[0].length + 1;


                const emptyRow =
                    new Array(
                        columnCount
                    ).fill("");


                newRows.push(
                    emptyRow
                );


                renderSelectedVisual(
                    selectedIndex
                );
            }
        );


        // ============================================================
        // SUBMIT ALL
        // ============================================================

        document.getElementById(
            "submitButton"
        ).addEventListener(
            "click",
            async function () {

                const selectedIndex =
                    Number(
                        document.getElementById(
                            "visualSelector"
                        ).value
                    );


                const visual =
                    discoveredVisuals[
                        selectedIndex
                    ];


                if (!visual) {

                    return;
                }


                const rows =
                    parseCSV(
                        visual.data
                    );


                if (
                    rows.length === 0
                ) {

                    return;
                }


                const headers =
                    rows[0];


                const table =
                    document.querySelector(
                        "#tableContainer table"
                    );


                if (!table) {

                    return;
                }


                const tableRows =
                    table.querySelectorAll(
                        "tbody tr"
                    );


                const records = [];


                tableRows.forEach(
                    function (tr) {

                        const recordType =
                            tr.dataset.recordType;


                        const cells =
                            tr.querySelectorAll(
                                "td"
                            );


                        const record = {

                            recordType:
                                recordType
                        };


                        if (
                            recordType ===
                            "existing"
                        ) {

                            headers.forEach(
                                function (
                                    header,
                                    columnIndex
                                ) {

                                    record[header] =
                                        cells[
                                            columnIndex
                                        ].textContent;
                                }
                            );


                            record.UserInput =
                                cells[
                                    headers.length
                                ]
                                    .querySelector(
                                        "input"
                                    )
                                    .value;
                        }


                        if (
                            recordType ===
                            "new"
                        ) {

                            headers.forEach(
                                function (
                                    header,
                                    columnIndex
                                ) {

                                    record[header] =
                                        cells[
                                            columnIndex
                                        ]
                                            .querySelector(
                                                "input"
                                            )
                                            .value;
                                }
                            );


                            record.UserInput =
                                cells[
                                    headers.length
                                ] !== undefined
                                    ? cells[
                                        headers.length
                                    ]
                                        .querySelector(
                                            "input"
                                        )
                                        ?.value || ""
                                    : "";
                        }


                        records.push(
                            record
                        );
                    }
                );


                const payload = {

                    visual:
                        visual.visualTitle ||
                        visual.visualName,

                    records:
                        records

                };


                document.getElementById(
                    "payload"
                ).textContent =
                    JSON.stringify(
                        payload,
                        null,
                        2
                    );


                document.getElementById(
                    "payloadContainer"
                ).style.display =
                    "block";


                try {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "Submitting data...";


                    await fetch(
                        APPS_SCRIPT_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "text/plain"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                ),

                            mode: "no-cors"
                        }
                    );


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Submitted successfully to Google Sheet.";

                }

                catch (error) {

                    console.error(
                        "Submit failed:",
                        error
                    );

                    document.getElementById(
                        "status"
                    ).textContent =
                        "Submit failed: " +
                        error.message;
                }

            }
        );


        // ============================================================
        // SIMPLE CSV PARSER
        // ============================================================

        function parseCSV(csv) {

            const lines =
                csv
                    .trim()
                    .split(/\r?\n/);


            return lines.map(
                function (line) {

                    return line.split(",");
                }
            );
        }


        initialize();

    </script>

</body>
</html>
