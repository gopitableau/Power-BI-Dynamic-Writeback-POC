<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Power BI Dynamic Discovery POC</title>

    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        button {
            margin-right: 10px;
            padding: 8px 14px;
        }

        #embedContainer {
            width: 100%;
            height: 600px;
            margin-top: 20px;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h2>Power BI Dynamic Discovery POC</h2>

    <button id="loginButton">
        Sign in with Microsoft
    </button>

    <button id="discoverButton" style="display:none;">
        Discover Pages & Visuals
    </button>

    <p id="status">
        Not signed in.
    </p>

    <pre id="result"></pre>

    <div id="embedContainer"></div>


    <script>

        // ============================================================
        // 1. CONFIGURATION
        // ============================================================

        const CLIENT_ID =
            "6588aca8-e4a4-4d89-b1b0-3ddac9ac3db9"
 ;

        const REPORT_ID =
            "3e159d02-3091-4567-884f-e47e2b868657";

        const EMBED_URL =
            "https://app.powerbi.com/reportEmbed?reportId=3e159d02-3091-4567-884f-e47e2b868657&groupId=a7d9dbb8-000f-4978-8081-e658a24539b4";


        // ============================================================
        // 2. MICROSOFT LOGIN CONFIGURATION
        // ============================================================

        const msalConfig = {

            auth: {

                clientId: CLIENT_ID,

                authority:
                    "https://login.microsoftonline.com/organizations",

                redirectUri:
                    "https://gopitableau.github.io/Power-BI-Dynamic-Writeback-POC/"
            },

            cache: {

                cacheLocation: "localStorage"
            }
        };


        const msalInstance =
            new msal.PublicClientApplication(msalConfig);


        const powerBIScope =
            "https://analysis.windows.net/powerbi/api/Report.Read.All";


        let embeddedReport = null;


        // ============================================================
        // 3. INITIALIZE
        // ============================================================

        async function initialize() {

            try {

                await msalInstance.initialize();

                const response =
                    await msalInstance.handleRedirectPromise();

                if (response) {

                    showSignedInUser(response.account);

                    return;
                }


                const accounts =
                    msalInstance.getAllAccounts();


                if (accounts.length > 0) {

                    showSignedInUser(accounts[0]);
                }

            }
            catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Authentication error: " +
                    error.message;
            }
        }


        // ============================================================
        // 4. LOGIN
        // ============================================================

        document.getElementById("loginButton")
            .addEventListener("click", async function () {

                try {

                    await msalInstance.loginRedirect({

                        scopes: [
                            "User.Read",
                            powerBIScope
                        ]

                    });

                }
                catch (error) {

                    console.error(error);

                    document.getElementById("status").textContent =
                        "Login error: " +
                        error.message;
                }

            });


        // ============================================================
        // 5. SHOW SIGNED-IN USER
        // ============================================================

        function showSignedInUser(account) {

            document.getElementById("status").textContent =
                "Signed in successfully as: " +
                (account.username || account.name);


            document.getElementById("loginButton")
                .style.display = "none";


            document.getElementById("discoverButton")
                .style.display = "inline-block";
        }


        // ============================================================
        // 6. GET POWER BI TOKEN
        // ============================================================

        async function getPowerBIAccessToken() {

            const accounts =
                msalInstance.getAllAccounts();


            if (accounts.length === 0) {

                throw new Error(
                    "No signed-in account found."
                );
            }


            const tokenResponse =
                await msalInstance.acquireTokenSilent({

                    scopes: [powerBIScope],

                    account: accounts[0]

                });


            return tokenResponse.accessToken;
        }


        // ============================================================
        // 7. DISCOVER PAGES AND VISUALS
        // ============================================================

        document.getElementById("discoverButton")
            .addEventListener("click", async function () {

                const resultElement =
                    document.getElementById("result");


                resultElement.textContent =
                    "Getting Power BI access token...";


                try {

                    const accessToken =
                        await getPowerBIAccessToken();


                    resultElement.textContent =
                        "Loading Power BI report...";


                    const models =
                        window['powerbi-client'].models;


                    const embedConfiguration = {

                        type: "report",

                        tokenType:
                            models.TokenType.Aad,

                        accessToken:
                            accessToken,

                        embedUrl:
                            EMBED_URL,

                        id:
                            REPORT_ID,

                        permissions:
                            models.Permissions.Read,

                        settings: {

                            panes: {

                                filters: {
                                    visible: false
                                },

                                pageNavigation: {
                                    visible: false
                                }

                            }

                        }

                    };


                    const container =
                        document.getElementById(
                            "embedContainer"
                        );


                    embeddedReport =
                        powerbi.embed(
                            container,
                            embedConfiguration
                        );


                    embeddedReport.on(
                        "loaded",
                        async function () {

                            try {

                                resultElement.textContent =
                                    "Report loaded. Discovering pages...";


                                const pages =
                                    await embeddedReport.getPages();


                                const result = [];


                                for (
                                    const page of pages
                                ) {

                                    const visuals =
                                        await page.getVisuals();


                                    result.push({

                                        pageName:
                                            page.name,

                                        pageDisplayName:
                                            page.displayName,

                                        visuals:
                                            visuals.map(
                                                visual => ({

                                                    name:
                                                        visual.name,

                                                    type:
                                                        visual.type,

                                                    title:
                                                        visual.title,

                                                    layout:
                                                        visual.layout

                                                })
                                            )

                                    });

                                }


                                resultElement.textContent =
                                    JSON.stringify(
                                        result,
                                        null,
                                        2
                                    );

                            }
                            catch (error) {

                                console.error(error);

                                resultElement.textContent =
                                    "Discovery failed:\n\n" +
                                    error.message;
                            }

                        }
                    );


                    embeddedReport.on(
                        "error",
                        function (event) {

                            console.error(event);

                            resultElement.textContent =
                                "Power BI report error:\n\n" +
                                JSON.stringify(
                                    event.detail,
                                    null,
                                    2
                                );
                        }
                    );

                }
                catch (error) {

                    console.error(error);

                    resultElement.textContent =
                        "Discovery failed:\n\n" +
                        error.message;
                }

            });


        initialize();

    </script>

</body>
</html>
